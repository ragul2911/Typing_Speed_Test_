<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <header>
       <div class="title">
         <img src="../img/logo-large.svg" alt="">
        <div id="wpm1">
            <img src="../img/icon-personal-best.svg" alt="">
            <h4 class="best1">personal best: </h4>
            <h4><span id="wpm2">0</span></h4>
            <h4>wpm</h4>
        </div>
       </div> 
       <nav>
            <div class="data1">
             <h5>wpm:</h5>
             <h5><span id="wpm3">0</span></h5>
             <h5>Accuracy:</h5>
             <h5><span id="accuracy">100%</span></h5>
             <h5>Time:</h5>
             <h5><span id="time">0:60</span><span id="time">s</span></h5>
            </div>
        <div class="data2">
        <div class="difficulty">
        <h5>Difficulty:</h5>
        <button class="level" id="easy-btn">easy</button>
        <button class="level" id="medium-btn">medium</button>
        <button class="level" id="hard-btn">hard</button>
        </div>
        <h5>Mode:</h5>
        <button class="mode1" id="timed-btn">Timed(60s)</button>
        <button class="mode1" id="passage-btn">Passage</button>
        </div>
       </nav>
       <div id="char"></div>
    </header>
    <main>
        <section class="typing-area">
            <div class="overlay" id="overlay">
                <button class="type" id="btn1">start Typing Test</button>
                <p>Or click the text and start typing</p>
            </div>
            <div class="passage" id="">
                <p id="paragraph"></p>
                <input type="text" id="typing-input" autocomplete="off" spellcheck="false" autofocus >
            </div>
        </section>
        
    </main><br>
    <footer class="attribution">
        <button class="refresh" id="refresh">Restart Test
            <img src="../img/icon-restart.svg" width="13px" alt="">
        </button>
        <div>Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
        Coded by <a href="#">K RAGUL</a>.</div>
    </footer>
    <script src="index.js"></script>
</body>
</html>
